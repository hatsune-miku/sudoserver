name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Embed the matching release candidate version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "LOCALSHELLD_RELEASE_TAG=v${version}-rc.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Verify PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: $PSVersionTable.PSVersion
      - name: Verify system Bash
        if: runner.os != 'Windows'
        shell: bash
        run: /bin/bash --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release
      - name: Verify real user and root daemon identities
        if: runner.os != 'Windows'
        run: python3 scripts/test-dual-daemon.py target/release/localshelld
      - name: Verify embedded version
        if: env.LOCALSHELLD_RELEASE_TAG != ''
        shell: bash
        run: |
          binary=target/release/localshelld
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          actual="$("$binary" --version | tr -d '\r')"
          test "$actual" = "localshelld ${LOCALSHELLD_RELEASE_TAG#v}"
          printf '%s\n' "$actual" > target/release/release-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: localshelld-${{ matrix.platform }}
          path: |
            target/release/localshelld
            target/release/localshelld.exe
            target/release/release-version.txt
          if-no-files-found: error
