name: Release Candidate
run-name: Release candidate from CI #${{ github.event.workflow_run.run_number }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-candidate-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  create-candidate:
    name: Package CI artifacts and create prerelease
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download Windows and Linux artifacts from CI
        uses: actions/download-artifact@v4
        with:
          pattern: sudoserver-*
          path: binaries
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify and package both platforms
        shell: bash
        run: |
          windows_binary="$(find binaries -type f -name 'sudoserver.exe' -print -quit)"
          linux_binary="$(find binaries -type f -name 'sudoserver' -print -quit)"
          test -n "$windows_binary" || { echo 'Windows artifact is missing' >&2; exit 1; }
          test -n "$linux_binary" || { echo 'Linux artifact is missing' >&2; exit 1; }

          mkdir -p packages/SudoServer-windows-x86_64 packages/SudoServer-linux-x86_64 assets
          cp "$windows_binary" packages/SudoServer-windows-x86_64/
          cp "$linux_binary" packages/SudoServer-linux-x86_64/
          chmod +x packages/SudoServer-linux-x86_64/sudoserver
          cp README.md LICENSE-MIT packages/SudoServer-windows-x86_64/
          cp README.md LICENSE-MIT packages/SudoServer-linux-x86_64/

          (cd packages && zip -qr ../assets/sudoserver-windows-x86_64.zip SudoServer-windows-x86_64)
          tar -czf assets/sudoserver-linux-x86_64.tar.gz -C packages SudoServer-linux-x86_64
          (cd assets && sha256sum sudoserver-* > SHA256SUMS)

      - name: Derive release candidate version
        id: version
        env:
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Cargo package version: $version" >&2
            exit 1
          fi
          tag="v${version}-rc.${RUN_NUMBER}.${RUN_ATTEMPT}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          gh release create "$RC_TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "SudoServer $RC_TAG" \
            --generate-notes \
            --prerelease
