name: Release Candidate
run-name: Release candidate from CI #${{ github.event.workflow_run.run_number }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-candidate-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  create-candidate:
    name: Package CI artifacts and create prerelease
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download all platform artifacts from CI
        uses: actions/download-artifact@v4
        with:
          pattern: sudoserver-*
          path: binaries
          merge-multiple: false
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify and package all platforms
        shell: bash
        run: |
          mkdir -p assets
          for platform in windows-x86_64 linux-x86_64 macos-aarch64 macos-x86_64; do
            binary=sudoserver
            if [[ "$platform" == windows-* ]]; then binary=sudoserver.exe; fi
            source="binaries/sudoserver-$platform/$binary"
            test -f "$source" || { echo "$platform artifact is missing" >&2; exit 1; }
            package="SudoServer-$platform"
            mkdir -p "packages/$package"
            cp "$source" "packages/$package/"
            cp README.md LICENSE-MIT "packages/$package/"
            if [[ "$platform" == windows-* ]]; then
              (cd packages && zip -qr "../assets/sudoserver-$platform.zip" "$package")
            else
              chmod +x "packages/$package/sudoserver"
              tar -czf "assets/sudoserver-$platform.tar.gz" -C packages "$package"
            fi
          done
          (cd assets && sha256sum sudoserver-* > SHA256SUMS)

      - name: Derive release candidate version
        id: version
        env:
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Cargo package version: $version" >&2
            exit 1
          fi
          tag="v${version}-rc.${RUN_NUMBER}.${RUN_ATTEMPT}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          gh release create "$RC_TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "SudoServer $RC_TAG" \
            --generate-notes \
            --prerelease
