name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-rc.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: localshelld-windows-x86_64
            binary: target/release/localshelld.exe
          - os: ubuntu-latest
            artifact: localshelld-linux-x86_64
            binary: target/release/localshelld
          - os: macos-15
            artifact: localshelld-macos-aarch64
            binary: target/release/localshelld
          - os: macos-15-intel
            artifact: localshelld-macos-x86_64
            binary: target/release/localshelld
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and embed the release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$GITHUB_REF_NAME" = "v$version"
          echo "LOCALSHELLD_RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - run: cargo test --all-targets
      - run: cargo build --release
      - name: Verify embedded version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          actual="$("$BINARY" --version | tr -d '\r')"
          test "$actual" = "localshelld ${LOCALSHELLD_RELEASE_TAG#v}"
          printf '%s\n' "$actual" > target/release/release-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.binary }}
            target/release/release-version.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: false
      - name: Package verified binaries
        env:
          LOCALSHELLD_RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/package-release.sh
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
