<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SudoServer 权限令牌</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6fa;
      --panel: #fff;
      --line: #c3cedb;
      --control-line: #8190a3;
      --text: #1b2b3f;
      --muted: #53657b;
      --accent: #245aa8;
      --red: #b42332;
      --green: #17704b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .wrap { max-width: 820px; margin: 48px auto; padding: 0 20px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    h2 { font-size: 20px; margin: 0 0 12px; }
    .sub { color: var(--muted); margin: 0 0 28px; }
    .warning { border: 1px solid #e4bc78; background: #fff6e8; color: #7a4216; padding: 16px 18px; border-radius: 10px; margin-bottom: 20px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin: 16px 0; }
    label { display: block; color: var(--muted); font-size: 13px; margin: 12px 0 5px; }
    input, select, button, textarea { font: inherit; }
    input, select { width: 100%; color: var(--text); background: var(--panel); border: 1px solid var(--control-line); border-radius: 7px; padding: 10px; }
    input::placeholder { color: var(--muted); opacity: 1; }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    button { border: 0; border-radius: 7px; background: var(--accent); color: #fff; font-weight: 650; padding: 10px 16px; cursor: pointer; margin-top: 16px; }
    button:hover { background: #1c4786; }
    button.danger { background: var(--red); color: #fff; margin: 0; }
    button.danger:hover { background: #921d2a; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .result { display: none; margin-top: 18px; }
    .token { display: block; width: 100%; min-height: 110px; background: #f0f8f3; color: #155c3f; border: 1px solid #aacbb7; border-radius: 7px; padding: 10px; word-break: break-all; }
    .status { min-height: 24px; margin-top: 12px; color: var(--muted); }
    .ok { color: var(--green); }
    .err { color: var(--red); }
    #tokens { overflow-x: auto; }
    table { width: 100%; min-width: 580px; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { text-align: left; border-bottom: 1px solid var(--line); padding: 9px 6px; }
    code { font-family: ui-monospace, monospace; }
    @media (max-width: 620px) { .row { grid-template-columns: 1fr; } .wrap { margin-top: 24px; } }
  </style>
</head>
<body><main class="wrap">
  <h1>SudoServer</h1><p class="sub">签发与管理本次系统启动周期内的提权令牌</p>
  <div class="warning"><strong>你将授予完整的管理员/root 权限。</strong><br>持有令牌的程序可以代表你修改系统、安装软件、删除数据。只在你理解并同意具体任务时签发；完成后立即撤销。</div>
  <section class="card">
    <h2>身份验证</h2>
    <div class="row"><div><label for="kind">验证方式</label><select id="kind"><option value="totp" selected>Authenticator 动态密码（TOTP）</option><option value="password">Master Password</option></select></div><div><label id="credentialLabel" for="credential">6 位动态码</label><input id="credential" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="输入 6 位动态码"></div></div>
  </section>
  <section class="card">
    <h2>签发新令牌</h2><label for="duration">有效期</label><select id="duration"><option value="86400">24 小时（默认）</option><option value="3600">1 小时</option><option value="900">15 分钟</option><option value="604800">7 天</option><option value="permanent">永久（直到服务重启或手动撤销）</option></select><button id="issue">确认授权并签发</button>
    <div id="issueResult" class="result"><label>令牌只显示在这里，请交给需要提权的 Agent</label><textarea id="token" class="token" readonly></textarea><button id="copy">复制令牌</button></div><div id="status" class="status"></div>
  </section>
  <section class="card"><h2>本次运行已签发令牌</h2><button id="refresh">验证身份并刷新列表</button><div id="tokens"></div></section>
</main><script>
const $=id=>document.getElementById(id); const credential=()=>({type:$('kind').value,value:$('credential').value});
function updateCredentialMode(){
  const totp=$('kind').value==='totp';
  const input=$('credential');
  input.value='';
  input.autocomplete=totp?'one-time-code':'current-password';
  input.inputMode=totp?'numeric':'text';
  if(totp)input.maxLength=6;
  else input.removeAttribute('maxlength');
  input.placeholder=totp?'输入 6 位动态码':'输入 Master Password';
  $('credentialLabel').textContent=totp?'6 位动态码':'Master Password';
}
$('kind').onchange=updateCredentialMode;
updateCredentialMode();
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json().catch(()=>({error:r.statusText}));if(!r.ok)throw new Error(data.error||r.statusText);return data}
function status(message,error=false){$('status').textContent=message;$('status').className='status '+(error?'err':'ok')}
$('issue').onclick=async()=>{try{const d=$('duration').value;if(d==='permanent'&&!confirm('永久令牌风险很高，并且仍会在 SudoServer/系统重启后失效。继续吗？'))return;const body={credential:credential(),permanent:d==='permanent'};if(d!=='permanent')body.ttl_seconds=Number(d);const data=await api('/v1/admin/tokens/issue',body);$('token').value=data.token;$('issueResult').style.display='block';status('令牌已签发。请在任务结束后撤销。');await refresh()}catch(e){status(e.message,true)}};
$('copy').onclick=async()=>{await navigator.clipboard.writeText($('token').value);status('已复制到剪贴板。')};
async function refresh(){try{const rows=await api('/v1/admin/tokens/list',{credential:credential()});$('tokens').innerHTML='<table><tr><th>标识</th><th>签发时间</th><th>到期时间</th><th>状态</th><th></th></tr>'+rows.map(r=>`<tr><td><code>${r.id.slice(0,8)}</code></td><td>${new Date(r.issued_at*1000).toLocaleString()}</td><td>${r.expires_at?new Date(r.expires_at*1000).toLocaleString():'永久'}</td><td>${r.revoked?'已撤销':'有效'}</td><td>${r.revoked?'':`<button class="danger" data-id="${r.id}">撤销</button>`}</td></tr>`).join('')+'</table>';$('tokens').querySelectorAll('button').forEach(b=>b.onclick=()=>revoke(b.dataset.id));status('列表已刷新。')}catch(e){status(e.message,true)}}
async function revoke(id){if(!confirm('撤销令牌并立即终止其会话？'))return;try{await api('/v1/admin/tokens/revoke',{credential:credential(),id});await refresh()}catch(e){status(e.message,true)}}
$('refresh').onclick=refresh;
</script></body></html>
